# Posting schedule.
#
# Edit this by hand. The tool never rewrites it -- what has already gone out is
# recorded separately in out/queue_state.json, so your comments and ordering
# survive every run.
#
#   product   folder name under products/
#   lang      hi or en
#   when      YYYY-MM-DD HH:MM
#   platform  dryrun  logs what it would post, changes nothing  <- start here
#             folder  drops the video + caption into to_post/<date>/ to upload
#             facebook / instagram / youtube  need API access, see PHASE2.md
#   aspect    9:16 (default), 1:1, 4:5, 16:9
#   note      optional reminder to yourself
#
# Check it with:   python -m reelfactory queue
# Test a date with: python -m reelfactory run --now "2026-08-04 19:30"
#
# Generate entries instead of typing them:
#   python -m reelfactory plan products --start tomorrow --time 19:30 \
#          --days mon,wed,fri --lang hi --platform dryrun --write calendar.yaml

- product: sample-iron-shelf
  lang: hi
  platform: dryrun
  when: 2026-08-04 19:30
  note: replace these two with your own products once the output looks right

- product: sample-iron-shelf
  lang: en
  platform: dryrun
  when: 2026-08-06 19:30
